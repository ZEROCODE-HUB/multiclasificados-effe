name: Limpiar adjuntos huérfanos

# Barre los archivos del almacenamiento que ya no pertenecen a ningún aviso.
#
# Por qué existe: un archivo pertenece a un aviso por su ruta. Cuando el aviso se
# borra, o cuando alguien empieza a publicar, sube una foto y se marcha sin
# terminar, el archivo se queda ocupando sitio sin que nadie lo vea. Nada lo
# limpiaba, y por eso había 26 archivos acumulados de avisos ya borrados.
#
# Por qué NO es un cron de la base de datos, que sería lo natural aquí: quitar la
# fila de `storage.objects` no libera el archivo —se queda en el almacén, ahora
# además sin índice—, así que hay que pasar por la API de Storage. Y desde
# GitHub el secreto vive donde viven los secretos, en vez de dentro del SQL.
#
# Qué decide qué sobra: la función `adjuntos_huerfanos` (migración 0122), que solo
# mira los tres buckets de avisos, exige que la ruta lleve un identificador
# válido, comprueba que ese aviso no exista, y nunca toca nada de menos de tres
# días. Un formulario a medio rellenar no está en riesgo: nadie tarda tres días.
#
# Necesita dos secretos en el repositorio. Sin ellos el trabajo falla a la vista
# en vez de borrar a ciegas:
#   SUPABASE_FUNCTIONS_URL  → https://<proyecto>.supabase.co/functions/v1
#   PAYMENT_WORKER_SECRET   → el mismo que ya usa la emisión de comprobantes

on:
  schedule:
    # Domingos de madrugada (hora de Perú). No corre en horario de uso.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Borrar de verdad. Sin marcar, solo dice qué borraría."
        type: boolean
        default: false

jobs:
  limpiar:
    runs-on: ubuntu-latest
    steps:
      - name: Barrer
        env:
          URL: ${{ secrets.SUPABASE_FUNCTIONS_URL }}
          SECRETO: ${{ secrets.PAYMENT_WORKER_SECRET }}
          # A mano manda la casilla; en el barrido semanal, siempre borra.
          APLICAR: ${{ github.event_name == 'schedule' && 'true' || inputs.aplicar }}
        run: |
          if [ -z "$URL" ] || [ -z "$SECRETO" ]; then
            echo "Faltan los secretos SUPABASE_FUNCTIONS_URL o PAYMENT_WORKER_SECRET."
            exit 1
          fi
          respuesta=$(curl -sS -X POST "$URL/limpiar-adjuntos" \
            -H "Content-Type: application/json" \
            -H "x-worker-secret: $SECRETO" \
            -d "{\"aplicar\": $APLICAR}")
          echo "$respuesta"
          # Un fallo dentro de la función devuelve 200 con el motivo: si no se
          # mira, el trabajo saldría en verde sin haber limpiado nada.
          echo "$respuesta" | grep -q '"error"' && exit 1
          exit 0
