<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Sin `maximum-scale`/`user-scalable=no`: bloquear el zoom impide ampliar a
         quien lo necesita para leer (WCAG 1.4.4). El `viewport-fit=cover` sí se
         mantiene: es lo que respeta el notch/barra de gestos en el APK. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- iOS convierte SOLO, sin que nadie se lo pida, cualquier cosa que parezca
         un correo, un teléfono o una dirección en un enlace azul subrayado. En el
         chat eso hacía que tocar el correo del anunciante de un aviso
         confidencial abriera Gmail y sacara al usuario de la app. Los enlaces de
         verdad los ponemos nosotros. -->
    <meta name="format-detection" content="telephone=no, email=no, address=no, date=no" />
    <!-- Favicon (icono de la pestaña del navegador) e iconos PWA -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#192F5E" />
    <!-- Solo tema claro. Va en el <head> para que el navegador lo sepa antes de
         pintar: si espera al CSS, los controles nativos parpadean en oscuro. -->
    <meta name="color-scheme" content="light" />
    <!-- Preconexión a orígenes críticos (fuentes de Google, Storage de Supabase e
         imágenes de Unsplash): adelanta el handshake DNS/TLS y acorta el LCP,
         más notorio en móvil con red lenta. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://prhbgniwymaaevnisyov.supabase.co" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- Preload del hero (LCP en desktop). Va con `media` porque el hero es
         `hidden md:flex`: en móvil no se muestra y no queremos gastar la
         descarga. Así la imagen es descubrible en el HTML inicial (IT2-008). -->
    <link rel="preload" as="image" href="/hero-bg.webp" media="(min-width: 768px)" fetchpriority="high" />
    <!-- Fuente Montserrat SIN bloquear el render (EFFE-009/019/017): se carga como
         preload y se promueve a stylesheet. Antes usaba un `onload` inline, pero
         eso es un manejador de eventos en línea que la CSP con `script-src` (sin
         unsafe-inline) bloquea (IT2-003). La promoción la hace font-boot.js: un
         script externo de 'self' de <1 KB, en vez de esperar a que se descargue y
         ejecute el bundle entero, que retrasaba la petición de la fuente hasta
         después del JS (IT3-008). Con display=swap el texto pinta de inmediato en
         la fuente de respaldo y luego cambia. -->
    <link id="montserrat-font" rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" />
    <script defer src="/font-boot.js"></script>
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" /></noscript>
    <title>eFFe Multiclasificados | Avisos Clasificados en Perú</title>
    <meta name="description" content="Plataforma líder de avisos clasificados en Perú. Publica y encuentra inmuebles, vehículos, empleos, servicios y más.">
    <meta name="author" content="eFFe Multiclasificados" />
    
    
    <!-- Estas etiquetas son las que leen WhatsApp, Facebook y compañía, que NO
         ejecutan JavaScript. Al compartir un aviso concreto las sustituye
         api/og-aviso.ts con la foto y el título de ESE aviso; lo de aquí es lo
         que se ve al compartir el sitio o cualquier otra página. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="eFFe Multiclasificados" />
    <meta property="og:url" content="https://www.coleffe.com/" />
    <meta property="og:locale" content="es_PE" />
    <meta property="og:image" content="https://www.coleffe.com/icon-512.png">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@eFFeClasificados" />
    <meta name="twitter:image" content="https://www.coleffe.com/icon-512.png">
    <meta property="og:title" content="eFFe Multiclasificados | Avisos Clasificados en Perú">
  <meta name="twitter:title" content="eFFe Multiclasificados | Avisos Clasificados en Perú">
  <meta property="og:description" content="Plataforma líder de avisos clasificados en Perú. Publica y encuentra inmuebles, vehículos, empleos, servicios y más.">
  <meta name="twitter:description" content="Plataforma líder de avisos clasificados en Perú. Publica y encuentra inmuebles, vehículos, empleos, servicios y más.">
</head>

  <body>
    <!-- Pantalla de carga inicial (se muestra hasta que React monta; evita el blanco) -->
    <style>
      #boot-loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#ffffff;z-index:9999;}
      #boot-loader .brand{font-family:Arial,Helvetica,sans-serif;font-weight:800;font-size:26px;letter-spacing:1px;color:#1e3a5f;}
      #boot-loader .brand b{color:#f97316;}
      #boot-loader .spin{width:34px;height:34px;border:3px solid #e5e7eb;border-top-color:#f97316;border-radius:50%;animation:bspin .8s linear infinite;}
      @keyframes bspin{to{transform:rotate(360deg)}}
    </style>
    <div id="root">
      <div id="boot-loader">
        <div class="brand">eFFe <b>Multiclasificados</b></div>
        <div class="spin"></div>
      </div>
    </div>
    <!-- Watchdog de arranque: si el bundle no ejecuta en unos segundos, muestra un
         aviso legible en vez del splash pegado. Script externo de 'self' (cumple
         la CSP) e independiente del bundle. Ver public/boot-watchdog.js -->
    <script defer src="/boot-watchdog.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
