workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Key2
    environment:
      ios_signing:
        provisioning_profiles:
          - eFFe Multiclasificados AppStore
        certificates:
          - Apple Distribution Certificate
      node: 22
      # Las VITE_* viven en Codemagic → Environment variables, dentro del grupo
      # "multiclasificados-effe". Un grupo NO se aplica solo: si no se declara
      # aquí en `groups`, sus variables no llegan al build y el IPA sale sin
      # configuración (arranca, pero sin login ni avisos). Sus valores NO se
      # repiten en `vars`: ver el porqué abajo.
      groups:
        - multiclasificados-effe
      #
      # Antes estaban listadas como `VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY`
      # y ESA era la causa del IPA roto: los valores de `vars` son literales, sin
      # expansión de shell, así que el build recibía la cadena "$VITE_SUPABASE_ANON_KEY"
      # (23 caracteres) PISANDO la clave real. El servidor respondía 401 "Invalid API
      # key" a todo, y de ahí la app que arrancaba pero no dejaba iniciar sesión ni
      # mostraba avisos. La URL corría la misma suerte: "https://$VITE_SUPABASE_URL".
      #
      # VITE_PUBLIC_SITE_URL es imprescindible: sin ella el pago Izipay y los
      # enlaces de compartir se rompen en iOS (ver PLAN-IMPLEMENTACION.md).
      vars:
        XCODE_SCHEME: App
    scripts:
      - name: Install dependencies
        # @capacitor/ios ya está en package.json → lo instala `npm ci`.
        script: npm ci
      - name: Verificar variables del build
        # Un IPA compilado sin estas variables ARRANCA pero no sirve para nada:
        # no deja iniciar sesión ni muestra avisos. Antes eso solo se descubría
        # instalando el build en un iPhone. Aquí el build falla de inmediato.
        # Si esto se dispara: Codemagic → Environment variables, grupo
        # "multiclasificados-effe" (el mismo nombre que hay en `environment.groups`;
        # si no coinciden, las variables llegan vacías pese a estar creadas).
        script: |
          # Limpia igual que `cleanEnvValue` en el front: espacios, retornos de
          # carro y un par de comillas envolventes. Sin esto, una clave pegada
          # como "eyJ..." (con comillas) tumbaba el build aunque la app sí
          # funciona, porque en tiempo de ejecución esas comillas se ignoran.
          limpiar() {
            printf '%s' "$1" | tr -d '\r' \
              | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' \
                    -e 's/^"\(.*\)"$/\1/' -e "s/^'\(.*\)'\$/\1/"
          }

          # Las de Google Maps son imprescindibles desde que los cuatro mapas son
          # suyos: sin la llave no se carga el SDK y sin el Map ID no se dibuja
          # ni un pin. Las dos fallan EN SILENCIO —mapa en blanco, sin error
          # visible— y el build llegaría a la App Store así. Mejor no compilar.
          faltan=""
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_PUBLIC_SITE_URL \
                   VITE_GOOGLE_MAPS_API_KEY VITE_GOOGLE_MAPS_MAP_ID; do
            eval "valor=\$$v"
            [ -z "$(limpiar "$valor")" ] && faltan="$faltan $v"
          done
          if [ -n "$faltan" ]; then
            echo "ERROR: faltan variables de entorno del build:$faltan"
            echo "Revisa Codemagic > Environment variables, grupo 'multiclasificados-effe'."
            echo "El nombre del grupo debe coincidir EXACTO con environment.groups de este"
            echo "archivo; si no, el grupo no se importa y las variables llegan vacias."
            exit 1
          fi

          KEY="$(limpiar "$VITE_SUPABASE_ANON_KEY")"
          if [ "$KEY" != "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "AVISO: VITE_SUPABASE_ANON_KEY llegaba con comillas o espacios."
            echo "La app los ignora, pero conviene limpiar el valor en Codemagic."
          fi

          clave_mala() {
            echo "ERROR: VITE_SUPABASE_ANON_KEY no es la clave anonima del proyecto ($1)."
            echo "  Longitud recibida : ${#KEY} caracteres"
            echo "  Empieza por       : $(printf '%s' "$KEY" | cut -c1-10)"
            echo "  Se espera         : eyJ... (JWT, 208 caracteres) o sb_publishable_... (46)"
            echo "  NO sirven: el token de cuenta (sbp_...), la service_role ni sb_secret_..."
            echo "  Se copia de Supabase > Project Settings > API Keys > anon / publishable."
            exit 1
          }

          # La clave anónima es un JWT (eyJ…, tres partes separadas por punto) o
          # una clave publicable (sb_publishable_…). Se comprueba también el largo:
          # con solo el prefijo, un pegado a medias pasaba por bueno.
          case "$KEY" in
            eyJ*)
              puntos=$(printf '%s' "$KEY" | tr -cd '.' | wc -c | tr -d ' ')
              [ "${#KEY}" -lt 100 ] && clave_mala "demasiado corta para un JWT"
              [ "$puntos" -ne 2 ] && clave_mala "a un JWT le faltan partes"
              ;;
            sb_publishable_*)
              [ "${#KEY}" -lt 30 ] && clave_mala "demasiado corta"
              ;;
            *) clave_mala "prefijo desconocido" ;;
          esac
          echo "Variables del build OK. Proyecto: $(limpiar "$VITE_SUPABASE_URL")"
      - name: Build React app
        script: npm run build
      - name: Excluir OTA (Capgo) del build de iOS
        # Apple prohíbe descargar y ejecutar código (directriz 2.5.2) y sus
        # escáneres marcan el plugin aunque esté inerte (autoUpdate: false). Se
        # quita ANTES de `cap add ios` para que no entre en el Podfile, pero
        # DESPUÉS de `npm run build`: Vite necesita resolver el import dinámico
        # de lib/ota.ts, que en iOS ni siquiera llega a ejecutarse.
        # Android conserva la OTA (su workflow no pasa por aquí).
        script: |
          npm pkg delete dependencies.@capgo/capacitor-updater
          rm -rf node_modules/@capgo/capacitor-updater
          echo "Capgo Updater excluido del proyecto iOS."
      - name: Add iOS platform
        script: npx cap add ios
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Configure iOS (deep link, permisos, Firebase, iconos)
        # `cap add ios` regenera ios/ en cada build, así que la config nativa se
        # reinyecta aquí por script (no se pierde entre compilaciones).
        script: |
          PLIST=ios/App/App/Info.plist
          # URL scheme del retorno del OAuth (equivale a AndroidManifest.xml).
          # Sin esto, appUrlOpen (nativeInit.ts) nunca dispara y el login social queda colgado.
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.effe.multiclasificados" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string com.effe.multiclasificados" "$PLIST" || true
          # Textos de permiso (obligatorios en iOS para el selector de fotos al publicar).
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Usamos la cámara para que adjuntes fotos a tus avisos.'" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Accedemos a tus fotos para adjuntar imágenes a tus avisos.'" "$PLIST" || true
          # Ubicación: la usa "Usar mi ubicación" de los filtros (navigator.geolocation
          # dentro del WebView). SIN esta clave iOS no puede ni pedir el permiso y
          # getCurrentPosition se queda colgado para siempre, sin éxito ni error:
          # el botón se quedaba en "Ubicando…" indefinidamente (MOB-08).
          /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'Usamos tu ubicación para mostrarte los avisos más cercanos a ti.'" "$PLIST" || true
          # No hacen falta más: la app no graba audio ni vídeo (los selectores de
          # archivo solo aceptan image/* y application/pdf) y no usa contactos,
          # calendario, micrófono ni Face ID. Pedir permisos que no se usan es
          # motivo de rechazo, así que no se añaden "por si acaso".
          #
          # Declaración de cifrado: la app solo usa HTTPS/TLS estándar, que está
          # exento. Sin esta clave, App Store Connect PREGUNTA en cada subida y
          # deja la build bloqueada hasta responder a mano.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" || true
          # Firebase (push iOS): copia el plist si está versionado en el repo.
          if [ -f ios-config/GoogleService-Info.plist ]; then
            cp ios-config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist copiado."
          else
            echo "AVISO: falta ios-config/GoogleService-Info.plist; el push en iOS no funcionará hasta agregarlo (ver PLAN-IMPLEMENTACION.md)."
          fi
          # Iconos/splash de iOS a partir de un master 1024x1024 (evita el placeholder de Capacitor).
          if [ -f assets/icon.png ]; then
            npx @capacitor/assets generate --ios
            echo "Iconos iOS generados."
          else
            echo "AVISO: falta assets/icon.png (1024x1024); la app saldría con el ícono placeholder de Capacitor."
          fi
      - name: Verificar la configuración nativa de iOS
        # Los `PlistBuddy ... || true` de arriba NO fallan si algo sale mal: son
        # `Add`, que da error cuando la clave ya existe (caso normal y correcto).
        # El precio es que un fallo real pasaría desapercibido y saldría un IPA
        # con un permiso ausente — que en iOS no da error, simplemente deja la
        # función colgada (fue lo que pasó con la ubicación, MOB-08).
        #
        # Por eso se comprueba el RESULTADO en vez de confiar en los comandos: si
        # falta algo, el build se cae aquí y no hay que leer ningún log para
        # enterarse. Si el build termina, la configuración está puesta.
        script: |
          PLIST=ios/App/App/Info.plist
          faltan=""
          leer() { /usr/libexec/PlistBuddy -c "Print :$1" "$PLIST" 2>/dev/null; }

          for clave in NSCameraUsageDescription NSPhotoLibraryUsageDescription NSLocationWhenInUseUsageDescription; do
            valor=$(leer "$clave")
            # Apple rechaza los textos vacíos o de relleno: han de explicar el uso.
            if [ -z "$valor" ] || [ ${#valor} -lt 15 ]; then
              faltan="$faltan\n  · $clave (valor: '${valor:-ninguno}')"
            else
              echo "OK  $clave — $valor"
            fi
          done

          esquema=$(leer "CFBundleURLTypes:0:CFBundleURLSchemes:0")
          if [ "$esquema" != "com.effe.multiclasificados" ]; then
            faltan="$faltan\n  · CFBundleURLSchemes (sin esto el login con Google se queda colgado al volver)"
          else
            echo "OK  URL scheme del OAuth — $esquema"
          fi

          if [ -n "$faltan" ]; then
            printf "\nERROR: la configuración nativa quedó incompleta:%b\n" "$faltan"
            echo "El IPA compilaría igual, pero esas funciones fallarían en silencio en el iPhone."
            exit 1
          fi

          # El push es la única pieza que puede faltar sin romper el build, porque
          # depende de un archivo que se descarga de la consola de Firebase y hoy
          # no está en el repo. Queda MUY visible al final del resumen.
          if [ -f ios/App/App/GoogleService-Info.plist ]; then
            echo "OK  Firebase (push) configurado."
          else
            echo ""
            echo "############################################################"
            echo "# ATENCIÓN: este IPA NO recibirá notificaciones push.       #"
            echo "# Falta ios-config/GoogleService-Info.plist en el repo.     #"
            echo "# Todo lo demás del build funciona con normalidad.          #"
            echo "############################################################"
          fi
          echo ""
          echo "Configuración nativa de iOS verificada."
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
      - name: Build iOS
        script: |
          xcode-project use-profiles
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive
      - name: Export IPA
        script: |
          xcode-project build-ipa \
            --project ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
